<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="When Should I Leave">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>When Should I Leave?</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f7ff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    input, select, button { font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const Ico = ({ d, size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {Array.isArray(d) ? d.map((p,i) => <path key={i} d={p}/>) : <path d={d}/>}
  </svg>
);

const I = {
  plane:   "M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z",
  car:     ["M3 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0","M15 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0","M1 17V9a4 4 0 0 1 4-4h9l4 5h1a2 2 0 0 1 2 2v5","M7 17h8"],
  pin:     ["M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z","M12 9m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0"],
  flag:    ["M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z","M4 22v-7"],
  nav:     "M3 11 22 2 13 21 11 13 3 11",
  book:    "M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z",
  cal:     ["M8 2v4","M16 2v4","M3 10h18","M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"],
  trash:   ["M3 6h18","M8 6V4h8v2","M19 6l-1 14H6L5 6"],
  check:   "M20 6L9 17l-5-5",
  refresh: ["M1 4v6h6","M23 20v-6h-6","M20.49 9A9 9 0 0 0 5.64 5.64L1 10","M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"],
};

const fmt = (date) => {
  if (!date || isNaN(date)) return "";
  return date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
};

const fmtDate = (date) => {
  if (!date) return "";
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(date); d.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  return date.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
};

const Dot = ({ color, icon }) => (
  <div style={{ width: 30, height: 30, borderRadius: "50%", background: color, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, color: "white", position: "relative", zIndex: 2 }}>
    <Ico d={I[icon]} size={14} />
  </div>
);

const inp = { width: "100%", padding: "13px 14px", border: "1.5px solid #e5e7eb", borderRadius: 10, fontSize: 16, outline: "none", background: "white", color: "#111", fontFamily: "inherit" };
const lbl = { fontSize: 13, color: "#9ca3af", marginBottom: 5, display: "block", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em" };
const sec = { fontSize: 16, fontWeight: 700, color: "#374151" };

function App() {
  const [tab, setTab] = React.useState("plan");
  const [flightNumber, setFlightNumber] = React.useState("");
  const [flightType, setFlightType] = React.useState("domestic");
  const [flightTime, setFlightTime] = React.useState("");
  const [flightDate, setFlightDate] = React.useState(new Date());
  const [travelMode, setTravelMode] = React.useState(null);
  const [travelTime, setTravelTime] = React.useState("");
  const [locationDetected, setLocationDetected] = React.useState(false);
  const [travelOptions, setTravelOptions] = React.useState(null);
  const [securityTime, setSecurityTime] = React.useState("25");
  const [gateTime, setGateTime] = React.useState("10");
  const [extraTime, setExtraTime] = React.useState("15");
  const [result, setResult] = React.useState(null);
  const [countdown, setCountdown] = React.useState(null);
  const [savedFlights, setSavedFlights] = React.useState(() => {
    try {
      const s = localStorage.getItem("wsil_flights");
      if (!s) return [];
      return JSON.parse(s).map(f => ({ ...f, flightDate: new Date(f.flightDate), departureTime: new Date(f.departureTime) }));
    } catch { return []; }
  });

  React.useEffect(() => {
    try { localStorage.setItem("wsil_flights", JSON.stringify(savedFlights)); } catch {}
  }, [savedFlights]);

  const boardingOffset = flightType === "domestic" ? 40 : 50;

  const getBoardingTime = () => {
    if (!flightTime) return null;
    const [h, m] = flightTime.split(":").map(Number);
    const d = new Date(flightDate); d.setHours(h, m, 0, 0);
    return new Date(d.getTime() - boardingOffset * 60000);
  };

  const boardingTime = getBoardingTime();

  const isToday = () => {
    const t = new Date(); t.setHours(0,0,0,0);
    const d = new Date(flightDate); d.setHours(0,0,0,0);
    return t.getTime() === d.getTime();
  };

  React.useEffect(() => {
    if (!result || !isToday()) { setCountdown(null); return; }
    const tick = () => {
      const diff = result.departureTime - new Date();
      if (diff <= 0) { setCountdown("Time to go!"); return; }
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      setCountdown(`${h > 0 ? h + "h " : ""}${m}m ${s}s`);
    };
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, [result, flightDate]);

  const requestLocation = () => {
    if (!navigator.geolocation) { alert("🚧 Live location & travel times are coming soon! For now, enter your travel time manually."); return; }
    navigator.geolocation.getCurrentPosition(
      () => {
        const car = 30 + Math.floor(Math.random() * 20);
        setTravelOptions({ car, transit: car + 10 + Math.floor(Math.random() * 15) });
        setLocationDetected(true);
      },
      () => alert("🚧 Live location & travel times are coming soon! For now, enter your travel time manually.")
    );
  };

  const selectMode = (mode) => { setTravelMode(mode); setTravelTime(String(travelOptions[mode])); };
  const totalMins = () => [travelTime, securityTime, gateTime, extraTime].reduce((s,v) => s + (parseInt(v)||0), 0);

  const calculate = () => {
    if (!flightTime || !travelTime) { alert("Please fill in flight time and travel time"); return; }
    const bt = getBoardingTime();
    const [h, m] = flightTime.split(":").map(Number);
    const ft = new Date(flightDate); ft.setHours(h, m, 0, 0);
    setResult({ departureTime: new Date(bt.getTime() - totalMins() * 60000), boardingTime: bt, flightTime: ft });
  };

  const reset = () => {
    setFlightNumber(""); setFlightType("domestic"); setFlightTime(""); setFlightDate(new Date());
    setTravelMode(null); setTravelTime(""); setLocationDetected(false); setTravelOptions(null);
    setSecurityTime("25"); setGateTime("10"); setExtraTime("15"); setResult(null); setCountdown(null);
  };

  const addToCalendar = () => {
    if (!result) return;
    const start = result.departureTime;
    const end = new Date(start.getTime() + 3600000);
    const pad = n => String(n).padStart(2,"0");
    const f = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${f(start)}\nDTEND:${f(end)}\nSUMMARY:Leave for airport${flightNumber?" – "+flightNumber:""}\nDESCRIPTION:Leave by ${fmt(start)} to catch your ${fmt(result.flightTime)} flight\nEND:VEVENT\nEND:VCALENDAR`;
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); a.download="leave-for-airport.ics"; a.click();
  };

  const saveFlight = () => {
    if (!result) return;
    setSavedFlights(f => [...f, { id: Date.now(), number: flightNumber||"Flight", flightTime, flightDate: new Date(flightDate), departureTime: result.departureTime, flightType }]);
    setTab("saved");
  };

  const dateOptions = Array.from({length:7},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()+i); return d; });

  const timelineSteps = result ? [
    ["🏠","Leave",result.departureTime],
    ["🚗","Arrive airport",new Date(result.departureTime.getTime()+(parseInt(travelTime)||0)*60000)],
    ["🛂","Through security",new Date(result.departureTime.getTime()+((parseInt(travelTime)||0)+(parseInt(securityTime)||0))*60000)],
    ["🚶","At gate & boarding",result.boardingTime],
    ["✈️","Departure",result.flightTime],
  ] : [];

  return (
    <div style={{minHeight:"100vh",background:"#f5f7ff",display:"flex",flexDirection:"column"}}>
      <div style={{flex:1,maxWidth:480,margin:"0 auto",width:"100%",padding:"24px 20px 100px",boxSizing:"border-box"}}>

        {/* Header */}
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{width:52,height:52,borderRadius:"50%",background:"#2563eb",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px",color:"white"}}>
            <Ico d={I.plane} size={24}/>
          </div>
          <h1 style={{fontSize:26,fontWeight:700,color:"#111",margin:"0 0 4px"}}>When Should I Leave?</h1>
          <p style={{fontSize:15,color:"#9ca3af",margin:0}}>Never miss your flight</p>
        </div>

        {tab === "plan" && (
          <div>
            <div style={{background:"white",borderRadius:20,border:"1px solid #ebebeb",padding:"24px 18px",position:"relative"}}>
              
              {/* Timeline line */}
              <div style={{position:"absolute",left:33,top:76,bottom:130,width:2,background:"linear-gradient(to bottom,#bfdbfe,#e9d5ff,#fbcfe8)",borderRadius:2,zIndex:0}}/>

              <div style={{display:"flex",flexDirection:"column",gap:28}}>

                {/* Flight */}
                <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
                  <Dot color="#2563eb" icon="plane"/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                      <p style={sec}>Flight details</p>
                      <div style={{display:"flex",gap:5}}>
                        {[{val:"domestic",label:"Domestic",mins:40},{val:"international",label:"Intl",mins:50}].map(({val,label,mins})=>(
                          <button key={val} onClick={()=>setFlightType(val)} title={`est. boarding ${mins} min before departure`} style={{padding:"5px 11px",fontSize:12,borderRadius:20,border:"none",cursor:"pointer",fontWeight:600,background:flightType===val?"#2563eb":"#f3f4f6",color:flightType===val?"white":"#9ca3af"}}>
                            {label}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Date picker */}
                    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:12}}>
                      {dateOptions.map((d,i)=>{
                        const sel = d.toDateString()===flightDate.toDateString();
                        return (
                          <button key={i} onClick={()=>setFlightDate(d)} style={{padding:"6px 2px",borderRadius:9,border:sel?"2px solid #2563eb":"1.5px solid #e5e7eb",background:sel?"#eff6ff":"white",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center"}}>
                            <span style={{fontSize:9,color:sel?"#2563eb":"#9ca3af",fontWeight:600,textTransform:"uppercase"}}>{i===0?"Today":d.toLocaleDateString("en-US",{weekday:"short"})}</span>
                            <span style={{fontSize:14,fontWeight:700,color:sel?"#2563eb":"#374151"}}>{d.getDate()}</span>
                          </button>
                        );
                      })}
                    </div>

                    {/* Flight # and time */}
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:8}}>
                      <div>
                        <label style={lbl}>Flight # (optional)</label>
                        <input style={inp} value={flightNumber} onChange={e=>setFlightNumber(e.target.value)} placeholder="AA123"/>
                      </div>
                      <div>
                        <label style={lbl}>Departure time</label>
                        <input style={inp} type="time" value={flightTime} onChange={e=>setFlightTime(e.target.value)}/>
                      </div>
                    </div>

                    {boardingTime && (
                      <p style={{fontSize:13,color:"#6b7280",marginTop:8,display:"flex",alignItems:"center",gap:4}}>
                        <Ico d={I.check} size={12}/> Boarding at {fmt(boardingTime)} · {boardingOffset} min before departure
                      </p>
                    )}
                  </div>
                </div>

                {/* Travel */}
                <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
                  <Dot color="#7c3aed" icon="car"/>
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{...sec,marginBottom:12}}>Travel to airport</p>
                    <div style={{display:"flex",gap:8,alignItems:"center"}}>
                      <input style={{...inp,flex:1}} type="number" value={travelTime} onChange={e=>{setTravelTime(e.target.value);setLocationDetected(false);setTravelOptions(null);setTravelMode(null);}} placeholder="Travel time in minutes"/>
                      <button onClick={requestLocation} style={{padding:"13px 14px",background:"#2563eb",border:"none",borderRadius:10,cursor:"pointer",color:"white",display:"flex",alignItems:"center",gap:5,fontSize:14,fontWeight:600,whiteSpace:"nowrap",flexShrink:0}}>
                        <Ico d={I.nav} size={14}/> Locate
                      </button>
                    </div>
                    {locationDetected && travelOptions && (
                      <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
                        {[{key:"car",label:"Drive",icon:"🚗"},{key:"transit",label:"Transit",icon:"🚇"}].map(({key,label,icon})=>(
                          <button key={key} onClick={()=>selectMode(key)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 14px",borderRadius:10,border:travelMode===key?"2px solid #2563eb":"1.5px solid #e5e7eb",background:travelMode===key?"#eff6ff":"#fafafa",cursor:"pointer"}}>
                            <span style={{fontSize:15,fontWeight:500,color:"#374151"}}>{icon} {label}</span>
                            <span style={{fontSize:15,fontWeight:700,color:travelMode===key?"#2563eb":"#374151"}}>{travelOptions[key]} min</span>
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                {/* At Airport */}
                <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
                  <Dot color="#db2777" icon="pin"/>
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{...sec,marginBottom:12}}>At airport</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                      {[["Security",securityTime,setSecurityTime,"25"],["Walk to gate",gateTime,setGateTime,"10"],["Buffer",extraTime,setExtraTime,"15"]].map(([label,val,set,ph])=>(
                        <div key={label}>
                          <label style={{...lbl,whiteSpace:"nowrap"}}>{label}</label>
                          <input style={inp} type="number" value={val} onChange={e=>set(e.target.value)} placeholder={ph}/>
                        </div>
                      ))}
                    </div>
                    <p style={{fontSize:13,color:"#9ca3af",marginTop:8}}>All in minutes</p>
                  </div>
                </div>

                {/* Bon Voyage */}
                <div style={{display:"flex",gap:14,alignItems:"center"}}>
                  <Dot color="#10b981" icon="flag"/>
                  <span style={{fontSize:16,fontWeight:700,color:"#10b981"}}>Bon voyage!</span>
                </div>

              </div>

              {/* Buttons */}
              <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:12,marginTop:24}}>
                <button onClick={reset} style={{padding:"11px 18px",background:"#f3f4f6",border:"none",borderRadius:10,cursor:"pointer",color:"#6b7280",fontSize:15,fontWeight:500,display:"flex",alignItems:"center",gap:5}}>
                  <Ico d={I.refresh} size={15}/> Reset
                </button>
                <button onClick={calculate} style={{padding:"13px 36px",background:"#2563eb",color:"white",border:"none",borderRadius:12,fontSize:16,fontWeight:700,cursor:"pointer",boxShadow:"0 2px 8px rgba(37,99,235,0.25)"}}>
                  Calculate
                </button>
              </div>
            </div>

            {/* Result */}
            {result && (
              <div style={{marginTop:14,borderRadius:20,background:"linear-gradient(135deg,#1d4ed8,#1e40af)",padding:"22px 18px",color:"white"}}>
                <div style={{textAlign:"center",marginBottom:16}}>
                  <p style={{fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",opacity:0.7,margin:"0 0 2px"}}>Leave by</p>
                  <p style={{fontSize:62,fontWeight:800,margin:"0 0 4px",lineHeight:1}}>{fmt(result.departureTime)}</p>
                  <p style={{fontSize:14,opacity:0.7,margin:"0 0 4px"}}>{fmtDate(flightDate)} · {fmt(result.flightTime)} flight</p>
                  <p style={{fontSize:13,opacity:0.55,margin:0}}>Total journey: {totalMins()} min</p>
                </div>

                {countdown && (
                  <div style={{background:"rgba(255,255,255,0.12)",borderRadius:12,padding:"10px 14px",textAlign:"center",marginBottom:12}}>
                    <p style={{fontSize:11,opacity:0.6,margin:"0 0 2px",textTransform:"uppercase",letterSpacing:"0.05em"}}>Time until you leave</p>
                    <p style={{fontSize:28,fontWeight:700,margin:0}}>{countdown}</p>
                  </div>
                )}

                {!isToday() && (
                  <div style={{background:"rgba(255,255,255,0.1)",borderRadius:12,padding:"10px 14px",textAlign:"center",marginBottom:12}}>
                    <p style={{fontSize:13,opacity:0.75,margin:0}}>Countdown starts on {fmtDate(flightDate)}</p>
                  </div>
                )}

                <div style={{background:"rgba(255,255,255,0.1)",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
                  {timelineSteps.map(([icon,label,time],i,arr)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:i<arr.length-1?"1px solid rgba(255,255,255,0.08)":"none"}}>
                      <span style={{fontSize:13,opacity:0.85}}>{icon} {label}</span>
                      <span style={{fontSize:14,fontWeight:700}}>{fmt(time)}</span>
                    </div>
                  ))}
                </div>

                <div style={{display:"flex",gap:8}}>
                  <button onClick={addToCalendar} style={{flex:1,padding:"11px",background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:10,color:"white",fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                    <Ico d={I.cal} size={14}/> Add to Calendar
                  </button>
                  <button onClick={saveFlight} style={{flex:1,padding:"11px",background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:10,color:"white",fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                    <Ico d={I.book} size={14}/> Save flight
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        {/* Saved Tab */}
        {tab === "saved" && (
          <div>
            <h2 style={{fontSize:18,fontWeight:700,color:"#111",margin:"0 0 14px"}}>Saved flights</h2>
            {savedFlights.length === 0 ? (
              <div style={{textAlign:"center",padding:"60px 20px",color:"#9ca3af"}}>
                <div style={{marginBottom:12,opacity:0.3,display:"flex",justifyContent:"center"}}><Ico d={I.plane} size={40}/></div>
                <p style={{fontSize:15,fontWeight:500,margin:"0 0 6px",color:"#6b7280"}}>No saved flights yet</p>
                <p style={{fontSize:13,margin:0}}>Calculate a flight and tap "Save flight"</p>
              </div>
            ) : (
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {savedFlights.map(f=>(
                  <div key={f.id} style={{background:"white",border:"1px solid #ebebeb",borderRadius:16,padding:"14px 16px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                      <div>
                        <p style={{fontSize:16,fontWeight:700,color:"#111",margin:"0 0 2px"}}>{f.number}</p>
                        <p style={{fontSize:13,color:"#9ca3af",margin:"0 0 10px"}}>{fmtDate(f.flightDate)} · {f.flightType}</p>
                        <div style={{display:"flex",gap:20}}>
                          <div>
                            <p style={{fontSize:11,color:"#9ca3af",margin:"0 0 2px",textTransform:"uppercase",fontWeight:600}}>Leave by</p>
                            <p style={{fontSize:22,fontWeight:700,color:"#2563eb",margin:0}}>{fmt(f.departureTime)}</p>
                          </div>
                          <div>
                            <p style={{fontSize:11,color:"#9ca3af",margin:"0 0 2px",textTransform:"uppercase",fontWeight:600}}>Flight</p>
                            <p style={{fontSize:22,fontWeight:700,color:"#374151",margin:0}}>{f.flightTime}</p>
                          </div>
                        </div>
                      </div>
                      <button onClick={()=>{ if(window.confirm("Delete this flight?")) setSavedFlights(s=>s.filter(x=>x.id!==f.id)); }} style={{background:"#fef2f2",border:"none",borderRadius:8,padding:"7px 9px",cursor:"pointer",color:"#ef4444",flexShrink:0}}>
                        <Ico d={I.trash} size={16}/>
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"white",borderTop:"1px solid #ebebeb",display:"flex",justifyContent:"center",padding:"10px 0 20px"}}>
        <div style={{display:"flex",maxWidth:420,width:"100%"}}>
          {[["plan","plane","Plan"],["saved","book","Saved"]].map(([id,icon,label])=>(
            <button key={id} onClick={()=>setTab(id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"none",border:"none",cursor:"pointer",padding:"5px 0",color:tab===id?"#2563eb":"#9ca3af"}}>
              <Ico d={I[icon]} size={22}/>
              <span style={{fontSize:12,fontWeight:600}}>{label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<Ico d="" size={0}/>, document.createElement('div'));
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
